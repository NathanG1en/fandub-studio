[project]
name = "fandub-backend"
version = "0.1.0"
description = "FanDub Studio FastAPI Backend Service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "sqlalchemy>=2.0.28",
    "greenlet>=3.0.0",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "yt-dlp>=2024.3.10",
    "python-multipart>=0.0.9",
    "websockets>=12.0",
    "scikit-learn>=1.4.0",
    "numpy>=1.26.0",
    "torchaudio>=2.2.0",
    "torch>=2.2.0",
    "openai-whisper>=20250625",
    "pyannote-audio>=4.0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.5",
    "httpx>=0.27.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
